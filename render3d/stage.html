<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { buildDex } from '/dex.mjs';

const W = +new URLSearchParams(location.search).get('w') || 800, H = +new URLSearchParams(location.search).get('h') || 1000;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.8;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
// gradient backdrop
const c = document.createElement('canvas'); c.width = 4; c.height = 256; const x = c.getContext('2d');
const gr = x.createLinearGradient(0, 0, 0, 256); gr.addColorStop(0, '#2a1250'); gr.addColorStop(0.6, '#1a0f3a'); gr.addColorStop(1, '#0c0a1e');
x.fillStyle = gr; x.fillRect(0, 0, 4, 256);
const bg = new THREE.CanvasTexture(c); bg.colorSpace = THREE.SRGBColorSpace; scene.background = bg;
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.3;

// stage platform + neon ring
const plat = new THREE.Mesh(new THREE.CylinderGeometry(1.9, 1.95, 0.1, 64), new THREE.MeshStandardMaterial({ color: 0x0e0b1f, roughness: 0.95, metalness: 0.0 }));
plat.position.y = -0.05; plat.receiveShadow = true; scene.add(plat);
const ring = new THREE.Mesh(new THREE.TorusGeometry(1.92, 0.03, 12, 96), new THREE.MeshBasicMaterial({ color: 0xff2fa0 }));
ring.rotation.x = Math.PI / 2; ring.position.y = 0.0; scene.add(ring);

const dex = buildDex(); scene.add(dex);

const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 100); scene.add(camera);
// lights ride on the camera so every angle is lit the same way
const key = new THREE.DirectionalLight(0xfff0e0, 1.7); key.position.set(-4, 6, 6); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.camera.left = -3; key.shadow.camera.right = 3; key.shadow.camera.top = 4; key.shadow.camera.bottom = -2; key.shadow.bias = -0.0004;
const fill = new THREE.PointLight(0xff2fa0, 40, 20); fill.position.set(4, 2, 4);
const rim = new THREE.PointLight(0x1fe6d2, 50, 20); rim.position.set(-3, 3, -6);
const hemi = new THREE.HemisphereLight(0xb9b0ff, 0x2a1030, 0.45);
camera.add(key, key.target, fill, rim); key.target.position.set(0, 1.5, 0); scene.add(hemi);
// camera-attached lights: target must be in scene
scene.add(key.target); key.target.position.set(0, 1.5, 0);

window.shot = (deg, dist = 8.4, h = 1.9, look = 1.75) => {
  const a = THREE.MathUtils.degToRad(deg);
  camera.position.set(Math.sin(a) * dist, h, Math.cos(a) * dist); camera.lookAt(0, look, 0);
  camera.updateMatrixWorld(); renderer.render(scene, camera);
};
window.ready = true;
</script>
